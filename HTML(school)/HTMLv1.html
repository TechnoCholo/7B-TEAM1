<!DOCTYPE html>
<html lang= "en">
<head>
<meta charset="UTF-8">
<title>My Interactive Page</title>
</head>
<body>
<style>
#title {
 text-align: center;
  font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;

}
body {

 color: white;
}
#myButton {
 border-radius: 10px;
 background-color: rgb(226, 211, 11);
width: 150px;
height: 80px;
text-align: center;
color: ghostwhite;

font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
}
#header {
  text-align: center;
  padding: 20px;
}

  width: 80px;

 align-items: center;

  text-align: center;
  border-radius: 40px;
  padding: 40px;
  padding-bottom: 40px;
  
}

  font-size: x-large;
}

<div id="header">
<img src="../HTML(school)/Images/F1 logo.png" alt="F1 logo" id="logo">
<h1 id="title">Favourites</h1>
</div>

<p id="list"> - Model <br><br>- Race Track <br><br>- Pilot </p>

</div>

<p id="textChange"></p>

<div id="model"></div>
<div id="pilot"></div>
<div id="track"></div>

 <script>

document.getElementById("myButton").onclick = function() {
  document.body.style.backgroundColor = "rgb(23, 28, 28)";
	document.getElementById("textChange").innerHTML = "F1 favourites:";
 const modelo = document.getElementById("model");
 modelo.innerHTML = '<img src="../HTML(school)/Images/F1 red bull" alt="Model">';
 const piloto = document.getElementById("pilot");
 piloto.innerHTML = '<img src="../HTML(school)/Images/Checo perez" alt="Pilot">';
 const pista = document.getElementById("track");
 pista.innerHTML = '<img src="../HTML(school)/Images/Abu dhabi F1" alt="Race Track">';
}
 </script>
